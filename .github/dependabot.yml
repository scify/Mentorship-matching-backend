# Dependabot configuration — https://docs.github.com/code-security/dependabot
#
# Strategy: keep PR noise low while staying current and secure.
#   - minor/patch updates are grouped into a single PR per ecosystem
#   - major updates stay ungrouped so breaking changes get individual review
#   - `cooldown` delays brand-new releases, reducing supply-chain risk from
#     a compromised or broken just-published version
#
# This repository is public, so it runs no GitHub Actions and holds no secrets.
# The deployment workflow lives in the private scify/jobpairs-deploy repo, which
# keeps its own pinned action SHAs patched. Dependabot itself is not Actions and
# uses no secrets, so composer/npm updates stay here with the code they track.
#
# Security (advisory-driven) updates also require "Dependabot security updates"
# to be enabled in the repository's Security settings.

version: 2

updates:
    # ---- PHP / Composer -------------------------------------------------
    - package-ecosystem: composer
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: '06:00'
          timezone: Etc/UTC
      open-pull-requests-limit: 10
      versioning-strategy: increase
      cooldown:
          default-days: 7
      labels:
          - dependencies
          - php
      # Routine updates: minor/patch only. Major bumps are skipped here, but
      # security updates can still propose a major if that's the only fix.
      ignore:
          - dependency-name: '*'
            update-types:
                - version-update:semver-major
      groups:
          composer-minor-patch:
              applies-to: version-updates
              update-types:
                  - minor
                  - patch

    # ---- JavaScript / npm ----------------------------------------------
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
          day: monday
          time: '06:00'
          timezone: Etc/UTC
      open-pull-requests-limit: 10
      versioning-strategy: increase
      cooldown:
          default-days: 7
      labels:
          - dependencies
          - javascript
      # Routine updates: minor/patch only. Major bumps are skipped here, but
      # security updates can still propose a major if that's the only fix.
      ignore:
          - dependency-name: '*'
            update-types:
                - version-update:semver-major
      groups:
          npm-minor-patch:
              applies-to: version-updates
              update-types:
                  - minor
                  - patch
