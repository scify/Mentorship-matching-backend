# This GitHub Actions workflow deploys the JobPairs (mentorship matching)
# application to the staging environment. It performs the following:
# 1. Analyses the code statically; nothing reaches staging unless it passes
# 2. Generates a .env file from a Jinja2 template using GitHub Secrets
# 3. Builds and compiles frontend assets on the GitHub runner
# 4. Opens a Cloudflare Access tunnel to the staging host, so every SSH and
#    rsync step below connects through 127.0.0.1:$TUNNEL_PORT instead of
#    reaching the server directly
# 5. Verifies the deployment user belongs to www-data group
# 6. Uploads the .env file to the staging server
# 7. Connects to the staging server to deploy the Laravel backend
# 8. Uploads compiled frontend assets to the staging server
# 9. Applies correct Laravel file permissions
# 10. Closes the Cloudflare Access tunnel
name: Deploy JobPairs app Staging

on:
    workflow_dispatch:

permissions:
    contents: read

# Two concurrent deploys would fight over the same working tree on the server.
concurrency:
    group: deploy-staging
    cancel-in-progress: false

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    # The PHP version used everywhere: the runner's static-analysis job, the
    # `php<version>` binary on the staging server, and the `php<version>-fpm`
    # service restarted at the end. It must stay >= what composer.lock resolves
    # to - the lock currently pulls Symfony 8.1, which requires PHP >= 8.4.1,
    # so building on 8.3 fails with "lock file does not contain a compatible
    # set of packages". Keep this in step with .ddev/config.yaml.
    PHP_VERSION: '8.4'
    # The branch staging is pinned to. Change this one line to re-point staging.
    DEPLOY_REF: security/fix-sqli-phpinfo-laravel-upgrade
    # Public base URL of the staging site. Not a secret, so it lives here rather
    # than in GitHub Secrets. It only feeds APP_URL, which builds the absolute
    # links inside notification emails - set it once the domain is known.
    STAGING_APP_URL: http://localhost

jobs:
    # ---------------------------------------------------------------------
    # Gate: nothing reaches staging unless the code analyses cleanly.
    # Static checks only - no database, so the PHPUnit feature suite (which
    # needs a migrated + seeded DB) is deliberately not run here.
    # ---------------------------------------------------------------------
    validate:
        name: Static analysis
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repo
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

            - name: Set up PHP ${{ env.PHP_VERSION }}
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
              with:
                  php-version: ${{ env.PHP_VERSION }}
                  coverage: none
                  tools: composer:v2

            - name: Validate composer.json / composer.lock
              run: composer validate --no-check-publish

            - name: Cache Composer downloads
              uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
              with:
                  path: ~/.cache/composer/files
                  key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
                  restore-keys: composer-${{ runner.os }}-

            # Larastan boots the Laravel container, so the app needs a readable
            # .env and an APP_KEY. .env.example is enough - nothing here talks
            # to the database.
            - name: Install dependencies
              run: |
                  cp .env.example .env
                  composer install --no-interaction --prefer-dist --no-progress
                  php artisan key:generate

            - name: Larastan (PHPStan level 6 + baseline)
              run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

            # phpstan.neon only covers app/, so syntax-check the rest as well.
            - name: PHP syntax check
              run: |
                  errors="$(find config database routes tests -name '*.php' -print0 \
                      | xargs -0 -n1 php -l 2>&1 \
                      | grep -v 'No syntax errors detected' || true)"
                  if [ -n "${errors}" ]; then
                      echo "${errors}"
                      exit 1
                  fi

    # ---------------------------------------------------------------------
    # Deploy. The staging host is not reachable directly: every SSH and rsync
    # connection is tunnelled through Cloudflare Access, authenticated with a
    # service token. cloudflared binds a local port on the runner and the SSH
    # client talks to 127.0.0.1 instead of the host.
    # ---------------------------------------------------------------------
    deploy:
        name: Deploy to Staging Server
        needs: validate
        runs-on: ubuntu-latest
        environment: staging
        env:
            # Local port that cloudflared binds; every SSH/rsync step targets
            # this instead of reaching the staging host directly.
            TUNNEL_PORT: '2222'

        steps:
            - name: Checkout repo
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

            # Only the database credentials come from GitHub Secrets; every
            # other value has a working default baked into the template.
            - name: Create .env file
              uses: cuchi/jinja2-action@8bd801365a8d36a0b20f45ee969161685de7785a # v1.3.0
              with:
                  template: .github/templates/.env.j2
                  # Not .env: the deploy step moves this into place only after
                  # splicing in the APP_KEY that already exists on the server.
                  output_file: .env.staging
                  strict: true
                  variables: |
                      APP_URL=${{ env.STAGING_APP_URL }}
                      APP_KEY=${{ secrets.APP_KEY }}
                      DB_HOST=${{ secrets.DB_HOST }}
                      DB_PORT=${{ secrets.DB_PORT }}
                      DB_DATABASE=${{ secrets.DB_DATABASE }}
                      DB_USERNAME=${{ secrets.DB_USERNAME }}
                      DB_PASSWORD=${{ secrets.DB_PASSWORD }}

            - name: Setup Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
              with:
                  node-version-file: .nvmrc
                  cache: npm

            # Laravel Mix production build (webpack 5). This project has no
            # `build` script - `prod` is the one. Building here rather than on
            # the server keeps Node off staging entirely, and a broken build
            # fails before anything is touched remotely.
            - name: Build frontend assets
              run: |
                  npm ci
                  npm run prod

            - name: Install cloudflared
              env:
                  # Pin the version and verify the download. Bump both together:
                  # curl -fsSL -o cf <url> && sha256sum cf
                  CLOUDFLARED_VERSION: '2026.8.3'
                  CLOUDFLARED_SHA256: 'f29324fe934d1e100617484c78deef803c4dc2cd351d645bbde42e96b4fccc5e'
              run: |
                  curl -fL --retry 3 --retry-delay 2 \
                    "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64" \
                    -o cloudflared
                  echo "${CLOUDFLARED_SHA256}  cloudflared" | sha256sum -c -
                  chmod +x cloudflared
                  sudo mv cloudflared /usr/local/bin/cloudflared
                  cloudflared --version

            - name: Open Cloudflare Access tunnel
              id: tunnel
              env:
                  TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
                  TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
                  CF_HOSTNAME: ${{ secrets.STAGING_HOST }}
              run: |
                  # An empty --hostname or service token makes cloudflared exit
                  # instantly; without this you just wait out the whole timeout
                  # and never learn that a secret was simply unset.
                  missing=""
                  [ -n "${CF_HOSTNAME}" ]                 || missing="${missing} STAGING_HOST"
                  [ -n "${TUNNEL_SERVICE_TOKEN_ID}" ]     || missing="${missing} CF_ACCESS_CLIENT_ID"
                  [ -n "${TUNNEL_SERVICE_TOKEN_SECRET}" ] || missing="${missing} CF_ACCESS_CLIENT_SECRET"
                  if [ -n "${missing}" ]; then
                      echo "::error::Unset secret(s) for the 'staging' environment:${missing}"
                      exit 1
                  fi

                  # debug level: at the default level a rejected service token
                  # is silent - cloudflared just closes the connection and the
                  # banner probe sees zero bytes, which looks identical to a
                  # missing SSH origin.
                  cloudflared access tcp \
                    --hostname "${CF_HOSTNAME}" \
                    --url "127.0.0.1:${TUNNEL_PORT}" \
                    --log-level debug \
                    > "${RUNNER_TEMP}/cloudflared.log" 2>&1 &
                  echo $! > "${RUNNER_TEMP}/cloudflared.pid"
                  cf_pid="$(cat "${RUNNER_TEMP}/cloudflared.pid")"

                  # cloudflared binds the local port immediately, before it knows whether
                  # the far end is reachable - so an open port proves nothing. Wait for a
                  # real SSH banner instead.
                  for i in $(seq 1 45); do
                    # Separate "cloudflared died" (bad token, unknown hostname,
                    # no route) from "it is up but nothing answers on SSH".
                    if ! kill -0 "${cf_pid}" 2>/dev/null; then
                      echo "::error::cloudflared exited after ${i}s without serving the tunnel to ${CF_HOSTNAME}."
                      echo "--- cloudflared log ---"
                      cat "${RUNNER_TEMP}/cloudflared.log" || true
                      exit 1
                    fi
                    banner="$(timeout 5 bash -c "exec 3<>/dev/tcp/127.0.0.1/${TUNNEL_PORT}; head -c 4 <&3" 2>/dev/null || true)"
                    case "${banner}" in
                      SSH-*)
                        echo "Tunnel to ${CF_HOSTNAME} reached an SSH server after ${i}s."
                        exit 0 ;;
                    esac
                    sleep 1
                  done

                  echo "::error::cloudflared is still running, but no SSH banner came back from ${CF_HOSTNAME} after 45s."
                  echo "Check, in this order:"
                  echo "  1. STAGING_HOST is the Cloudflare Access *application* hostname (e.g. ssh.staging.example.org), not an IP or the bare server name."
                  echo "  2. The Access application's policy allows this service token."
                  echo "  3. cloudflared is running on the staging server and its ingress maps that hostname to ssh://localhost:22."
                  echo "--- cloudflared log ---"
                  cat "${RUNNER_TEMP}/cloudflared.log" || true
                  exit 1

            - name: Verify user belongs to www-data group
              uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
              with:
                  host: 127.0.0.1
                  port: ${{ env.TUNNEL_PORT }}
                  username: ${{ secrets.PROJECT_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      set -e
                      if ! getent group www-data | grep -qw "$(whoami)"; then
                        echo "❌ ERROR: User '$(whoami)' is not a member of 'www-data' group."
                        echo "   Run: sudo usermod -a -G www-data $(whoami)"
                        echo "   Then log out and back in for changes to take effect."
                        exit 1
                      fi
                      echo "✅ Verified: $(whoami) is a member of www-data group"

            - name: SCP .env.staging to the staging server
              uses: easingthemes/ssh-deploy@2cc5b27bf3029d0455dd5e09fe02633904031447 # v6.0.3
              with:
                  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
                  REMOTE_HOST: 127.0.0.1
                  REMOTE_USER: ${{ secrets.PROJECT_USER }}
                  REMOTE_PORT: ${{ env.TUNNEL_PORT }}
                  SOURCE: '.env.staging'
                  TARGET: '${{ secrets.PROJECT_PATH }}'
                  # Explicit, and deliberately without --delete: TARGET is the
                  # whole project directory, not a build output directory.
                  ARGS: '-rlgoDzvc -i'
                  SSH_CMD_ARGS: '-o IdentitiesOnly=yes -o StrictHostKeyChecking=no'

            - name: Deploy backend
              uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
              with:
                  host: 127.0.0.1
                  port: ${{ env.TUNNEL_PORT }}
                  username: ${{ secrets.PROJECT_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      set -euo pipefail
                      PROJECT_DIR="${{ secrets.PROJECT_PATH }}"
                      DEPLOY_REF="${{ env.DEPLOY_REF }}"
                      PHP_CMD="/usr/bin/php${{ env.PHP_VERSION }}"

                      # Fail before `git reset --hard` and `artisan down` touch
                      # anything: a missing binary here would otherwise leave the
                      # app down with a half-applied deploy.
                      if [ ! -x "$PHP_CMD" ]; then
                        echo "ERROR: $PHP_CMD not found on the staging server."
                        echo "       Available: $(echo /usr/bin/php*)"
                        exit 1
                      fi

                      cd "$PROJECT_DIR"

                      # Put that PHP first in PATH so composer's own shebang and
                      # any nested `php` call use it too.
                      mkdir -p "$PROJECT_DIR/.bin"
                      printf '#!/bin/bash\nexec %s "$@"\n' "$PHP_CMD" > "$PROJECT_DIR/.bin/php"
                      chmod +x "$PROJECT_DIR/.bin/php"
                      export PATH="$PROJECT_DIR/.bin:$PATH"

                      echo "PHP version being used: $(php -v | head -n 1)"
                      echo "Which php: $(which php)"

                      # Composer lives in different places on different boxes.
                      COMPOSER_CMD=""
                      for candidate in /usr/local/bin/composer /usr/bin/composer; do
                        if [ -x "$candidate" ]; then
                          COMPOSER_CMD="$candidate"
                          break
                        fi
                      done
                      if [ -z "$COMPOSER_CMD" ]; then
                        COMPOSER_CMD="$(command -v composer || true)"
                      fi
                      if [ -z "$COMPOSER_CMD" ]; then
                        echo "ERROR: composer not found on the server"
                        exit 1
                      fi
                      echo "Using composer at: $COMPOSER_CMD"

                      echo "Pulling latest code from ${DEPLOY_REF}"
                      git fetch origin "$DEPLOY_REF"
                      git reset --hard "origin/${DEPLOY_REF}"

                      echo "Ensuring storage directories exist"
                      mkdir -p storage/framework/{sessions,views,cache}
                      mkdir -p storage/logs
                      mkdir -p bootstrap/cache

                      # The .env rendered by CI has an empty APP_KEY. Carry over the
                      # key already on the server so sessions survive the deploy; a
                      # missing one is generated below, once vendor/ exists.
                      if [ -f .env ]; then
                        existing_key="$(grep -m1 '^APP_KEY=base64:' .env || true)"
                      fi
                      mv .env.staging .env
                      if [ -n "${existing_key:-}" ]; then
                        echo "Reusing the existing APP_KEY"
                        sed -i "s|^APP_KEY=.*|${existing_key}|" .env
                      fi

                      echo "Verifying .env configuration..."
                      grep -E "CACHE_DRIVER|SESSION_DRIVER|QUEUE_CONNECTION" .env

                      # Any failure from here on leaves the app reachable again.
                      trap '$PHP_CMD artisan up || true' ERR

                      # vendor/ is absent on the very first deploy, and artisan
                      # cannot run without it.
                      if [ -f vendor/autoload.php ]; then
                        echo "Putting application in maintenance mode"
                        $PHP_CMD artisan down
                      else
                        echo "No vendor/ yet (first deploy) - skipping maintenance mode"
                      fi

                      echo "Installing Composer dependencies"
                      if ! $PHP_CMD "$COMPOSER_CMD" install \
                          --no-interaction \
                          --prefer-dist \
                          --optimize-autoloader \
                          --no-dev; then
                        echo "ERROR: Composer install failed"
                        tail -50 storage/logs/laravel.log 2>/dev/null || echo "No Laravel log found"
                        exit 1
                      fi

                      # First deploy only: no key was carried over, so make one.
                      # Needs vendor/, hence after composer install.
                      if ! grep -q '^APP_KEY=base64:' .env; then
                        echo "No APP_KEY found - generating one"
                        $PHP_CMD artisan key:generate --force
                      fi

                      echo "Running database migrations"
                      $PHP_CMD artisan migrate --force

                      echo "Discovering packages"
                      $PHP_CMD artisan package:discover --ansi

                      echo "Creating storage symlink"
                      $PHP_CMD artisan storage:link --force

                      echo "Clearing caches"
                      $PHP_CMD artisan route:clear
                      $PHP_CMD artisan cache:clear
                      $PHP_CMD artisan view:clear

                      echo "Creating new cache files"
                      $PHP_CMD artisan config:cache
                      $PHP_CMD artisan route:cache
                      $PHP_CMD artisan view:cache

                      echo "Backend deployment complete!"

            # Laravel Mix scatters its output across public/ rather than into a
            # single build directory, and every one of those paths is gitignored
            # - so `git reset --hard` above never touches them. Without
            # public/mix-manifest.json every page throws
            # MixManifestNotFoundException.
            - name: Upload compiled frontend assets
              uses: easingthemes/ssh-deploy@2cc5b27bf3029d0455dd5e09fe02633904031447 # v6.0.3
              with:
                  SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
                  REMOTE_HOST: 127.0.0.1
                  REMOTE_USER: ${{ secrets.PROJECT_USER }}
                  REMOTE_PORT: ${{ env.TUNNEL_PORT }}
                  SOURCE: 'public/'
                  TARGET: '${{ secrets.PROJECT_PATH }}/public/'
                  # No -go: don't force the runner's uid/gid onto the server.
                  # No --delete: public/storage is a server-side symlink that
                  # does not exist on the runner.
                  ARGS: '-rlDzvc -i'
                  EXCLUDE: '/storage'
                  SSH_CMD_ARGS: '-o IdentitiesOnly=yes -o StrictHostKeyChecking=no'

            - name: Set Laravel file permissions
              uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
              with:
                  host: 127.0.0.1
                  port: ${{ env.TUNNEL_PORT }}
                  username: ${{ secrets.PROJECT_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      set -e
                      PROJECT_DIR="${{ secrets.PROJECT_PATH }}"
                      cd "$PROJECT_DIR"

                      echo "Setting file permissions..."
                      chmod +x set-laravel-permissions-ci.sh
                      ./set-laravel-permissions-ci.sh "$PROJECT_DIR"

            - name: Restart PHP-FPM
              uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
              with:
                  host: 127.0.0.1
                  port: ${{ env.TUNNEL_PORT }}
                  username: ${{ secrets.PROJECT_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      set -e
                      echo "Restarting PHP-FPM to clear OPcache"
                      sudo service php${{ env.PHP_VERSION }}-fpm restart 2>/dev/null || sudo systemctl restart php${{ env.PHP_VERSION }}-fpm 2>/dev/null || echo "PHP-FPM restart skipped (configure NOPASSWD sudoers to enable)"

                      echo "Taking application out of maintenance mode"
                      /usr/bin/php${{ env.PHP_VERSION }} "${{ secrets.PROJECT_PATH }}/artisan" up

            - name: Recover from maintenance mode on failure
              if: failure() && steps.tunnel.outcome == 'success'
              uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
              with:
                  host: 127.0.0.1
                  port: ${{ env.TUNNEL_PORT }}
                  username: ${{ secrets.PROJECT_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      /usr/bin/php${{ env.PHP_VERSION }} "${{ secrets.PROJECT_PATH }}/artisan" up || true
                      echo "Recovery step complete: app taken out of maintenance mode"

            - name: Close Cloudflare Access tunnel
              if: always()
              run: |
                  pid_file="${RUNNER_TEMP}/cloudflared.pid"
                  if [ -f "${pid_file}" ]; then
                    kill "$(cat "${pid_file}")" 2>/dev/null || true
                  fi
